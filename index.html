<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VANGUARD_VS_ARCHITECT_MULTIPLAYER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #e0e8f0; overflow: hidden; font-family: monospace; width: 100%; height: 100%; }
        #ui-layer { position: fixed; top: 20px; left: 20px; color: #111; pointer-events: none; z-index: 10; font-size: 11px; }
        #cursor-ui { position: absolute; width: 40px; height: 40px; transform: translate(-50%, -50%); pointer-events: none; z-index: 9999; }
        .cursor-v, .cursor-h { position: absolute; background: #0088ff; box-shadow: 0 0 8px rgba(0, 136, 255, 0.6); }
        .cursor-v { left: 50%; width: 2px; height: 100%; }
        .cursor-h { top: 50%; width: 100%; height: 2px; }
        .controls { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(8px); padding: 14px; border: 2px solid #0088ff; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-transform: uppercase; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .status { color: #0055ff; font-weight: bold; }
        #three-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .currency-display { font-size: 13px; font-weight: bold; color: #b8860b; }
        .info-toggle { background: #0088ff; color: #fff; border: 1px solid #0066cc; padding: 3px 8px; font-size: 10px; cursor: pointer; text-transform: uppercase; border-radius: 3px; }
        .info-toggle:hover { background: #0055cc; }
        .control-details { margin-top: 5px; color: #444; }
        .live-metrics { font-size: 10px; color: #c86400; font-weight: bold; }
        #overhead-ui { position: fixed; pointer-events: none; z-index: 50; display: flex; flex-direction: column; gap: 3px; align-items: center; transform: translate(-50%, -100%); }
        .hp-bar, .hp-bar-ai { position: relative; width: 100px; height: 12px; background: #ccc; border: 1px solid #888; border-radius: 2px; overflow: hidden; box-sizing: border-box; }
        .hp-bar-ai { width: 140px; border-color: #009944; background: #c0ebd0; }
        #hp-fill, #base-hp-fill { height: 100%; background: #0077ff; transition: width 0.1s; }
        #base-hp-fill { background: #0044aa; }
        #ai-hp-fill, #ai-base-hp-fill { height: 100%; background: #00aa44; transition: width 0.3s; }
        .hp-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 8px; font-weight: bold; text-shadow: 1px 1px 2px #000; text-transform: uppercase; letter-spacing: 0.5px; z-index: 2; box-sizing: border-box; }
        #game-over-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,245,250,0.95); backdrop-filter: blur(10px); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #111; text-align: center; border: 6px solid #0088ff; box-sizing: border-box; }
        .restart-btn { background: #0088ff; color: #fff; border: 2px solid #0066cc; padding: 10px 25px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
        .restart-btn:hover { background: #0055cc; }
    </style>
</head>
<body>
<div id="cursor-ui"><div class="cursor-v"></div><div class="cursor-h"></div></div>
<div id="overhead-ui">
    <div class="hp-bar"><div id="hp-fill"></div><div id="hp-text" class="hp-text">VESSEL: 100%</div></div>
    <div class="hp-bar"><div id="base-hp-fill"></div><div id="base-hp-text" class="hp-text">BASE: 100%</div></div>
</div>
<div id="ui-layer">
    <div class="controls">
        <div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <span class="status" id="role-title">ROLE: CONNECTING...</span>
                <button class="info-toggle" onclick="toggleControls()">Controls [i]</button>
            </div>
            <div id="control-panel" class="control-details">
                [W/A/S/D] MOVE | [MOUSE] AIM | [G]/PAD SPAWN SNAIL (2G)<br>[LMB] FIRE | [DRAG RMB] BUILD WALLS | RAM FOES TO CRUSH!
            </div>
            <div class="currency-display">GOLD: <span id="player-gold">100</span></div>
            <div class="live-metrics">DEPLOYED: <span id="vanguard-men">0</span> MEN | <span id="vanguard-snails">0</span> SNAILS</div>
            <div style="font-size:9px; color:#555; margin-top:5px;">TARGET: <span id="z-health">DETECTING...</span></div>
        </div>
    </div>
</div>
<div id="game-over-screen">
    <h2 id="game-over-title">SIMULATION CONCLUDED</h2>
    <p id="game-over-reason">TERMINATION REASON</p>
    <button class="restart-btn" onclick="location.reload()">Restart</button>
</div>
<div id="three-canvas"></div>
<script>
const socket = io();
let myRole = 'blue';

socket.on('assigned_role', (role) => {
    myRole = role;
    document.getElementById('role-title').innerText = `ROLE: ${role.toUpperCase()}`;
    if(role === 'red') {
        playerSpawnPos.set(-460, 0, -460);
        if(playerGroup) playerGroup.position.copy(playerSpawnPos);
    }
});

let scene, camera, renderer, playerGroup, snakeHead, dirLight, floor, recruitmentPad;
let userBlocks = [], aiBlocks = [], wallMeshes = [], bullets = [], turrets = [], keys = {};
let isDragging = false, isFiring = false, fireTimer = 0;
let startPoint = new THREE.Vector3(), dragStartMouse = new THREE.Vector2();
let depthOffset = 0, horizOffset = 0, existingCubes = new Map(), yaw = 0;
const blockSize = 4, boatSpeed = 2.5, turnSpeed = 0.08, detectionZone = 650;
const maxWallGridHeight = 8 * blockSize;
const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
let playerHP = 100, playerBaseHP = 100, aiBaseHP = 100, playerGold = 100;
let gameActive = true, redRunnersKilled = 0, yellowRunnersKilled = 0, playerSnailsSpawned = 0, aiSnailsSpawned = 0;
let lastRecruitTime = 0; const recruitCooldown = 500;
let playerSpawnPos = new THREE.Vector3(460, 0, 460);
let remotePlayerGroup, treadRibs = [], stalkers = [], runners = [], snails = [], sirenGeo;

function toggleControls() { const p = document.getElementById('control-panel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }

function isInProtectedBase(x, z) {
    if (x >= 400 && z >= 400) return 'blue';
    if (x <= -400 && z <= -400) return 'red';
    return null;
}

function canBuildHere(pos, isPlayer) {
    if (isInProtectedBase(pos.x, pos.z)) return false;
    const diagSum = pos.x + pos.z;
    if (Math.abs(diagSum) < 8) return false;
    return true;
}

function createAlignedWallTexture(theme, isZWall) {
    const canvas = document.createElement('canvas');
    canvas.width = 1000; canvas.height = 100;
    const ctx = canvas.getContext('2d');
    const isBlue = theme === 'blue';
    ctx.fillStyle = isBlue ? '#08142b' : '#26060a';
    ctx.fillRect(0, 0, 1000, 100 - maxWallGridHeight);
    for (let u = 2; u < 1000; u += blockSize) {
        for (let y = 0; y < maxWallGridHeight; y += blockSize) {
            ctx.fillStyle = isBlue ? '#0a1a36' : '#33080e';
            ctx.fillRect(u, 100 - y - blockSize, blockSize, blockSize);
        }
    }
    return new THREE.CanvasTexture(canvas);
}

function createAlignedFloorTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1000; canvas.height = 1000;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#140003';
    ctx.fillRect(0, 0, 1000, 1000);
    for (let x = 2; x < 1000; x += blockSize) {
        for (let z = 2; z < 1000; z += blockSize) {
            let isBlue = (x + z) >= 1000;
            ctx.fillStyle = isBlue ? '#0a1a36' : '#33080e';
            ctx.fillRect(x, z, blockSize, blockSize);
        }
    }
    return new THREE.CanvasTexture(canvas);
}

class CrimsonStalker {
    constructor(cHex, sHex, isYBase=false, isRedRun=false, isYRun=false) {
        this.group = new THREE.Group(); this.limbs = {}; this.health = { head: 100, torso: 100, lArm: 100, rArm: 100, lLeg: 100, rLeg: 100 };
        this.isAlive = true; this.isShattered = false; this.shatterParticles = []; this.shatterTimer = 0;
        this.shatterHex = sHex; this.isYellowBaseMan = isYBase; this.isRedRunner = isRedRun; this.isYellowRunner = isYRun;
        this.navState = 'SEEK'; this.wallFollowDir = Math.random() > 0.5 ? 1 : -1; this.followSteps = 0;
        this.startFollowPos = new THREE.Vector3(); this.currentHeading = new THREE.Vector3(0, 0, 1);
        
        const mat = new THREE.MeshStandardMaterial({ color: cHex, roughness: 1.0 });
        const createPart = (n, w, h, d, y, p) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.y = y; m.userData.partName = n; p.add(m); this.limbs[n] = m; return m;
        };
        const t = createPart('torso', 2, 3, 1, 4, this.group); createPart('head', 1.2, 1.2, 1.2, 2.2, t);
        createPart('lArm', 0.6, 2.5, 0.6, 0.2, t).position.x = -1.5; createPart('rArm', 0.6, 2.5, 0.6, 0.2, t).position.x = 1.5;
        createPart('lLeg', 0.8, 3, 0.8, -3, t).position.x = -0.6; createPart('rLeg', 0.8, 3, 0.8, -3, t).position.x = 0.6;
        scene.add(this.group);
    }
    takeDamage(part, amt) {
        if (this.isShattered || !this.limbs[part]) return;
        this.health[part] -= (part === 'head' ? amt * 3 : amt);
        if (this.health.head <= 0 || this.health.torso <= 0) this.explode();
    }
    explode() {
        if (this.isShattered) return; this.isShattered = true; this.group.visible = false; this.markedForRemoval = true;
    }
    update(tPos) {
        if (this.isShattered) return;
        this.group.lookAt(tPos.x, this.group.position.y, tPos.z);
    }
}

class CrimsonSnail {
    constructor(cHex, isYTeam=true) {
        this.group = new THREE.Group(); this.health = 120; this.isShattered = false; this.isYellowTeam = isYTeam;
        this.moveSpeed = 0.5; this.currentWaypointIndex = 0; this.waypoints = [];
        this.navState = 'SEEK'; this.wallFollowDir = Math.random() > 0.5 ? 1 : -1; this.followSteps = 0;
        this.startFollowPos = new THREE.Vector3(); this.currentHeading = new THREE.Vector3(0, 0, 1);
        
        const mat = new THREE.MeshStandardMaterial({ color: cHex, roughness: 1.0 });
        const sh = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.2, 2.0, 8), mat); sh.rotation.z = Math.PI / 2; sh.position.y = 2; this.group.add(sh);
        const b = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 4.5), mat); b.position.y = 0.5; this.group.add(b);
        scene.add(this.group);
    }
    takeDamage(amt) {
        if (this.isShattered) return; this.health -= amt;
        if (this.health <= 0) { playerGold += 2; this.explode(); }
    }
    explode() {
        if (this.isShattered) return; this.isShattered = true; this.group.visible = false; this.markedForRemoval = true;
    }
}

function tryRecruitPlayerSnail() {
    if (!gameActive) return; let n = Date.now(); if (n - lastRecruitTime < recruitCooldown) return;
    if (playerGold >= 2) { playerGold -= 2; spawnYellowSnail(new THREE.Vector3(465, 0, 465)); lastRecruitTime = n; }
}
function spawnYellowSnail(pos) { playerSnailsSpawned++; let sn = new CrimsonSnail(0x0077ff, true); sn.group.position.copy(pos); sn.waypoints = [new THREE.Vector3(460, 0, 460), new THREE.Vector3(-460, 0, -460)]; snails.push(sn); }
function spawnRedSnail(pos) { aiSnailsSpawned++; let sn = new CrimsonSnail(0xcc2222, false); sn.group.position.copy(pos); sn.waypoints = [new THREE.Vector3(-460, 0, -460), new THREE.Vector3(460, 0, 460)]; snails.push(sn); }

function createCube(pos, col) {
    const g = new THREE.Group(), geo = new THREE.BoxGeometry(blockSize-0.08, blockSize-0.08, blockSize-0.08);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 1.0 }));
    g.add(m); g.position.copy(pos); return g;
}

function calculatePlacementTarget(hit) {
    let tPos = new THREE.Vector3();
    if (hit.object === floor) {
        tPos.set(Math.round(hit.point.x / blockSize) * blockSize, blockSize / 2, Math.round(hit.point.z / blockSize) * blockSize);
    } else {
        let r = hit.object; while(r.parent && r.parent !== scene) r = r.parent;
        tPos.copy(r.position).add(hit.face.normal.clone().multiplyScalar(blockSize));
    }
    return tPos;
}

function checkObstacleAt(pos, size) {
    if (Math.abs(pos.x) > 495 || Math.abs(pos.z) > 495) return true;
    const testBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(pos.x, 2, pos.z), size);
    for (let b of [...userBlocks, ...aiBlocks]) {
        if (new THREE.Box3().setFromObject(b).intersectsBox(testBox)) return true;
    }
    return false;
}

function executeBugNavigation(entity, currentPos, targetPos, sizeVec, speed) {
    let toTarget = new THREE.Vector3().subVectors(targetPos, currentPos); toTarget.y = 0;
    let directDir = toTarget.clone().normalize();
    let directClear = !checkObstacleAt(currentPos.clone().addScaledVector(directDir, speed * 2.2), sizeVec);
    if (directClear) return directDir;
    return directDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
}

function init() {
    scene = new THREE.Scene(); 
    scene.background = new THREE.Color(0xdce7f0);
    scene.fog = new THREE.FogExp2(0xdce7f0, 0.0012);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1200);
    renderer = new THREE.WebGLRenderer({ antialias: true }); 
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('three-canvas').innerHTML = "";
    document.getElementById('three-canvas').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb0bec5, 0.85));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(200, 300, 150);
    scene.add(dirLight);

    floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: createAlignedFloorTexture(), roughness: 1.0 })); 
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    recruitmentPad = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 0.4, 24), new THREE.MeshStandardMaterial({ color: 0x00aaff })); 
    recruitmentPad.position.set(465, 0.2, 465); 
    scene.add(recruitmentPad);

    playerGroup = new THREE.Group();
    const shipColor = myRole === 'blue' ? 0x0088ff : 0xcc2222;
    playerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.2, 5), new THREE.MeshStandardMaterial({ color: shipColor })));
    
    turrets = [];
    [[-1.8, 1.2], [1.8, 1.2]].forEach(p => {
        const b = new THREE.Group(); b.position.set(p[0], p[1], -1.5);
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 2.5), new THREE.MeshStandardMaterial({ color: 0x222222 })); 
        bar.rotation.x = Math.PI / 2; bar.position.z = -1;
        b.add(bar); playerGroup.add(b); turrets.push({ base: b, barrel: bar });
    });

    yaw = 0.785; playerGroup.rotation.y = yaw; playerGroup.position.copy(playerSpawnPos); 
    scene.add(playerGroup); 
    playerGroup.add(camera); camera.position.set(0, 7, 15); camera.lookAt(0, 0, -20);

    remotePlayerGroup = new THREE.Group();
    remotePlayerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.2, 5), new THREE.MeshStandardMaterial({ color: 0xcc2222 })));
    scene.add(remotePlayerGroup);

    socket.on('update_player', (data) => {
        remotePlayerGroup.position.set(data.x, 0, data.z);
        remotePlayerGroup.rotation.y = data.rotation;
    });

    socket.on('block_placed', (pos) => {
        const b = createCube(new THREE.Vector3(pos.x, pos.y, pos.z), 0xd03333);
        scene.add(b); aiBlocks.push(b); existingCubes.set(`${pos.x},${pos.y},${pos.z}`, b);
    });
}

window.addEventListener('mousedown', (e) => { 
    if (e.button === 0) isFiring = true; 
    if (e.button === 2) {
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects([floor, ...userBlocks], true);
        if (hits.length > 0) {
            let ptTarget = calculatePlacementTarget(hits[0]);
            if (ptTarget && canBuildHere(ptTarget, true)) {
                const k = `${Math.round(ptTarget.x)},${Math.round(ptTarget.y)},${Math.round(ptTarget.z)}`;
                if (!existingCubes.has(k)) {
                    const b = createCube(ptTarget, 0x0077ff);
                    scene.add(b); userBlocks.push(b); existingCubes.set(k, b);
                    socket.emit('place_block', { x: ptTarget.x, y: ptTarget.y, z: ptTarget.z });
                }
            }
        }
    }
});
window.addEventListener('mouseup', (e) => { if (e.button === 0) isFiring = false; });
window.addEventListener('mousemove', (e) => { 
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1; 
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1; 
    document.getElementById('cursor-ui').style.left = e.clientX + 'px'; 
    document.getElementById('cursor-ui').style.top = e.clientY + 'px'; 
});
window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyG') tryRecruitPlayerSnail(); });
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('contextmenu', e => e.preventDefault());

function animate() {
    requestAnimationFrame(animate); 
    if (!gameActive) { renderer.render(scene, camera); return; }

    if (mouse.x > 0.3) yaw -= turnSpeed * (mouse.x - 0.3); 
    if (mouse.x < -0.3) yaw -= turnSpeed * (mouse.x + 0.3); 
    playerGroup.rotation.y = yaw;

    let move = new THREE.Vector3(); 
    if(keys['KeyW']) move.z -= 1; if(keys['KeyS']) move.z += 1; 
    if(keys['KeyA']) move.x -= 1; if(keys['KeyD']) move.x += 1;

    if (move.length() > 0) {
        move.normalize().multiplyScalar(boatSpeed).applyQuaternion(playerGroup.quaternion);
        playerGroup.position.add(move);
        socket.emit('player_update', { x: playerGroup.position.x, z: playerGroup.position.z, rotation: yaw });
    }

    document.getElementById('player-gold').innerText = playerGold;
    document.getElementById('vanguard-snails').innerText = snails.filter(s => !s.isShattered).length;

    snails.forEach(sn => {
        if (!sn.isShattered) {
            let tar = sn.waypoints[sn.currentWaypointIndex];
            let steer = executeBugNavigation(sn, sn.group.position, tar, new THREE.Vector3(3.2, 3, 4.8), sn.moveSpeed);
            if(steer) sn.group.position.addScaledVector(steer, sn.moveSpeed);
        }
    });

    renderer.render(scene, camera);
}

init(); 
animate();
</script>
</body>
</html>
